                textGrid += `
                    <div class="voice-text-block">
                        <div class="voice-text-label">User Input</div>
                        <div class="voice-text-content">${escapeHtml(tr.user_input || '')}</div>
                    </div>
                `;
                if (hasTranscribed) {
                    textGrid += `
                        <div class="voice-text-block">
                            <div class="voice-text-label">Transcribed (STT)</div>
                            <div class="voice-text-content">${escapeHtml(tr.transcribed_input || '')}</div>
                        </div>
                    `;
                }
                textGrid += '</div>';
            }

            // Response comparison
            let responseGrid = '';
            if (tr.assistant_text || tr.golden_text) {
                responseGrid = `
                    <div class="voice-text-grid">
                        <div class="voice-text-block">
                            <div class="voice-text-label">Assistant Response</div>
                            <div class="voice-text-content">${escapeHtml(tr.assistant_text || '(empty - tool call only)')}</div>
                        </div>
                        <div class="voice-text-block">
                            <div class="voice-text-label">Golden Text</div>
                            <div class="voice-text-content">${escapeHtml(tr.golden_text || '')}</div>
                        </div>
                    </div>
                `;
            }

            // Tool call comparison
            let toolGrid = '';
            if (tr.expected_function_call || (tr.tool_calls && tr.tool_calls.length > 0)) {
                const expected = tr.expected_function_call;
                const actual = tr.tool_calls && tr.tool_calls.length > 0 ? tr.tool_calls[0] : null;
                toolGrid = `
                    <div class="voice-tool-grid">
                        <div class="voice-tool-block expected">
                            <div class="voice-text-label">Expected Tool Call</div>
                            <div class="voice-text-content">${expected ? escapeHtml(expected.name + '(' + JSON.stringify(expected.args || {}, null, 2) + ')') : '<span style="color:var(--text-muted)">None</span>'}</div>
                        </div>
                        <div class="voice-tool-block actual">
                            <div class="voice-text-label">Actual Tool Call</div>
                            <div class="voice-text-content">${actual ? escapeHtml(actual.name + '(' + JSON.stringify(actual.arguments || {}, null, 2) + ')') : '<span style="color:var(--text-muted)">None</span>'}</div>
                        </div>
                    </div>
                `;
            }

            // Per-turn latency row
            const pc = pipelineComponents || {};
            let latencyRow = '<div class="voice-turn-latency">';
            if (tr.stt_latency_ms !== undefined) latencyRow += `<span class="voice-turn-latency-item">${pc.stt || 'STT'}: <strong>${(tr.stt_latency_ms/1000).toFixed(2)}s</strong></span>`;
            if (tr.llm_latency_ms !== undefined) latencyRow += `<span class="voice-turn-latency-item">${pc.llm || 'LLM'}: <strong>${(tr.llm_latency_ms/1000).toFixed(2)}s</strong></span>`;
            if (tr.tts_latency_ms !== undefined) latencyRow += `<span class="voice-turn-latency-item">${pc.tts || 'TTS'}: <strong>${(tr.tts_latency_ms/1000).toFixed(2)}s</strong></span>`;
            latencyRow += `<span class="voice-turn-latency-item">Total: <strong>${((tr.latency_ms || 0)/1000).toFixed(2)}s</strong></span>`;
            if (tr.tokens) latencyRow += `<span class="voice-turn-latency-item">Tokens: <strong>${tr.tokens.total_tokens || 0}</strong></span>`;
            latencyRow += '</div>';

            // Judge reasoning
            let reasoning = '';
            if (j.reasoning) {
                reasoning = `<div class="voice-reasoning">${escapeHtml(j.reasoning)}</div>`;
            }

            // Audio players
            let audioSection = '';
            const af = tr.audio_files;
            if (af && audioDirName) {
                const audioLabels = {
                    input_tts: 'Input Audio (TTS)',
                    stt_input: null,  // skip — same file as input_tts
                    response_tts: 'Response Audio (TTS)',
                    s2s_output: 'Response Audio (S2S)',
                };
                const players = Object.entries(af)
                    .filter(([key]) => audioLabels[key] !== null && audioLabels[key] !== undefined)
                    .map(([key, relPath]) => {
                        const url = '/api/audio/' + audioDirName + '/' + relPath.replace(/\\\\/g, '/').replace(/\\/g, '/');
                        return `
                            <div class="voice-audio-item">
                                <span class="voice-audio-label">${audioLabels[key] || key}</span>
                                <audio controls preload="none" src="${url}" style="height:32px;"></audio>
                            </div>
                        `;
                    }).join('');
                if (players) {
                    audioSection = `
                        <div class="voice-audio-section">
                            <div style="font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Recorded Audio</div>
                            ${players}
                        </div>
                    `;
                }
            }

            return `
                <div class="voice-turn-card">
                    <div class="voice-turn-header">
                        <span class="voice-turn-num">Turn ${(tr.turn_index || 0) + 1}</span>
                        ${badges}
                    </div>
                    ${textGrid}
                    ${responseGrid}
                    ${toolGrid}
                    ${latencyRow}
                    ${audioSection}
                    ${reasoning}
                </div>
            `;
        }

        function renderVoiceRunsAccordion(modelName, modelData, pipelineType, pipelineComponents, audioDirName) {
            const runs = modelData.runs || [];
            if (runs.length === 0) return '';

            return `
                <div class="results-section">
                    <h2 class="section-title">${escapeHtml(modelName)} — Run Details</h2>
                    <div class="result-accordion">
                        ${runs.map((run, ri) => {
                            const passColor = run.pass_rate >= 80 ? 'var(--win)' : run.pass_rate >= 50 ? 'var(--tie)' : 'var(--loss)';
                            const passBg = run.pass_rate >= 80 ? 'rgba(63,185,80,0.15)' : run.pass_rate >= 50 ? 'rgba(240,183,47,0.15)' : 'rgba(248,81,73,0.15)';
                            const judgments = run.judgments || [];

                            return `
                                <div class="result-accordion-item" onclick="this.classList.toggle('open')">
                                    <div class="result-accordion-header">
                                        <div class="result-accordion-title">
                                            <span class="result-id">${escapeHtml(run.scenario_id || 'Scenario')}</span>
                                            <span class="result-category">Run ${run.run_index !== undefined ? run.run_index + 1 : ri + 1}</span>
                                            <span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600;padding:3px 10px;border-radius:4px;background:${passBg};color:${passColor}">${(run.pass_rate || 0).toFixed(1)}%</span>
                                        </div>
                                        <span class="result-accordion-arrow">&#9660;</span>
                                    </div>
                                    <div class="result-accordion-content">
                                        ${(run.turn_results || []).map((tr, ti) => {
                                            const j = judgments.find(jj => jj.turn_index === tr.turn_index) || judgments[ti] || {};
                                            return renderVoiceTurnDetail(tr, j, pipelineType, pipelineComponents, audioDirName);
                                        }).join('')}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderVoiceRadarChart(summaries, modelNames) {
            const ctx = document.getElementById('voiceRadarChart');
            if (!ctx) return;
            if (charts.voiceRadarChart) charts.voiceRadarChart.destroy();

            const dimLabels = ['Tool Use', 'Instruction', 'KB Grounding', 'Turn Taking'];
            const dimKeys = ['tool_use_correct', 'instruction_following', 'kb_grounding', 'turn_taking'];
            const colors = ['#a855f7', '#06b6d4', '#f97316', '#3fb950'];

            charts.voiceRadarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: dimLabels,
                    datasets: modelNames.map((m, i) => ({
                        label: m,
                        data: dimKeys.map(k => summaries[m]?.dims[k] || 0),
                        borderColor: colors[i % colors.length],
                        backgroundColor: colors[i % colors.length] + '20',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: colors[i % colors.length],
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: '#30363d' },
                            angleLines: { color: '#30363d' },
                            pointLabels: { color: '#8b949e', font: { family: 'IBM Plex Mono', size: 11 } },
                            ticks: { display: false }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#8b949e', font: { family: 'IBM Plex Mono' } }
                        }
                    }
                }
            });
        }

        function renderVoiceLatencyChart(summaries, modelNames, pipelineComponents) {
            const ctx = document.getElementById('voiceLatencyChart');
            if (!ctx) return;
            if (charts.voiceLatencyChart) charts.voiceLatencyChart.destroy();

            const pc = pipelineComponents || {};
            const sttLabel = pc.stt ? `STT (${pc.stt})` : 'STT';
            const llmLabel = pc.llm ? `LLM (${pc.llm})` : 'LLM';
            const ttsLabel = pc.tts ? `TTS (${pc.tts})` : 'TTS';

            // Only show if at least one model has cascaded latency data
            const hasCascaded = modelNames.some(m => summaries[m]?.hasCascadedLatency);

            if (hasCascaded) {
                charts.voiceLatencyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: modelNames,
                        datasets: [
                            {
                                label: sttLabel,
                                data: modelNames.map(m => (summaries[m]?.sttAvg || 0) / 1000),
                                backgroundColor: '#f97316',
                                borderRadius: { topLeft: 0, topRight: 0 },
                            },
                            {
                                label: llmLabel,
                                data: modelNames.map(m => (summaries[m]?.llmAvg || 0) / 1000),
                                backgroundColor: '#a855f7',
                            },
                            {
                                label: ttsLabel,
                                data: modelNames.map(m => (summaries[m]?.ttsAvg || 0) / 1000),
                                backgroundColor: '#06b6d4',
                                borderRadius: { topLeft: 4, topRight: 4 },
                            },
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { stacked: true, grid: { display: false }, ticks: { color: '#8b949e', font: { family: 'IBM Plex Mono' } } },
                            y: { stacked: true, beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e', callback: v => v + 's' } }
                        },
                        plugins: {
                            legend: { position: 'bottom', labels: { color: '#8b949e', font: { family: 'IBM Plex Mono' } } },
                            tooltip: {
                                callbacks: {
                                    title: (items) => items.length ? items[0].dataset.label : '',
                                    label: (item) => `${(item.raw * 1000).toFixed(0)} ms`
                                }
                            }
                        }
                    }
                });
            } else {
                // Fallback: show TTFB + Total latency per model
                charts.voiceLatencyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: modelNames,
                        datasets: [
                            {
                                label: 'TTFB',
                                data: modelNames.map(m => (summaries[m]?.ttfbAvg || 0) / 1000),
                                backgroundColor: '#a855f7',
                                borderRadius: 4,
                            },
                            {
                                label: 'Total',
                                data: modelNames.map(m => (summaries[m]?.latAvg || 0) / 1000),
                                backgroundColor: '#06b6d4',
                                borderRadius: 4,
                            },
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#8b949e', font: { family: 'IBM Plex Mono' } } },
                            y: { beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e', callback: v => v + 's' } }
                        },
                        plugins: {
                            legend: { position: 'bottom', labels: { color: '#8b949e', font: { family: 'IBM Plex Mono' } } }
                        }
                    }
                });
            }
        }

        function renderVoiceDimensionBarsChart(summaries, modelNames) {
            const ctx = document.getElementById('voiceDimChart');
            if (!ctx || modelNames.length < 2) return;
            if (charts.voiceDimChart) charts.voiceDimChart.destroy();

            const dimLabels = ['Tool Use', 'Instruction', 'KB Grounding', 'Turn Taking'];
            const dimKeys = ['tool_use_correct', 'instruction_following', 'kb_grounding', 'turn_taking'];
            const colors = ['#a855f7', '#06b6d4', '#f97316', '#3fb950'];

            charts.voiceDimChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dimLabels,
                    datasets: modelNames.map((m, i) => ({
                        label: m,
                        data: dimKeys.map(k => summaries[m]?.dims[k] || 0),
                        backgroundColor: colors[i % colors.length],
                        borderRadius: 4,
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#8b949e', font: { family: 'IBM Plex Mono', size: 10 } } },
                        y: { beginAtZero: true, max: 100, grid: { color: '#30363d' }, ticks: { color: '#8b949e', callback: v => v + '%' } }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#8b949e', font: { family: 'IBM Plex Mono' } } }
                    }
                }
            });
        }

        function renderVoice(data) {
            const results = data.results || {};
            const config = data.config || {};
            const modelNames = config.models || Object.keys(results);
            const pipelineType = config.pipeline_type || 'text';
            const pipelineComponents = config.pipeline_components || {};
            // Extract audio dir basename for building audio URLs
            const rawAudioDir = config.audio_dir || '';
            const audioDirName = rawAudioDir ? rawAudioDir.replace(/\\/g, '/').split('/').filter(Boolean).pop() : '';

            // Compute summaries
            const summaries = {};
            modelNames.forEach(m => {
                const md = results[m] || {};
                summaries[m] = computeModelSummary(md.aggregated, md.runs);
            });

            // Total runs
            const totalRuns = modelNames.reduce((s, m) => s + (results[m]?.runs?.length || 0), 0);

            // Build charts section
            const hasMultiModel = modelNames.length > 1;
            let chartsHtml = `
                <div class="charts-section">
                    <div class="chart-card">
                        <div class="chart-title">Dimension Balance (Radar)</div>
                        <div class="chart-container">
                            <canvas id="voiceRadarChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-title">Pipeline Latency</div>
                        <div class="chart-container">
                            <canvas id="voiceLatencyChart"></canvas>
                        </div>
                    </div>
                </div>
            `;

            if (hasMultiModel) {
                chartsHtml += `
                    <div class="charts-section">
                        <div class="chart-card">
                            <div class="chart-title">Dimension Comparison</div>
                            <div class="chart-container">
                                <canvas id="voiceDimChart"></canvas>
                            </div>
                        </div>
                    </div>
                `;
            }

            mainContent.innerHTML = `
                <div class="dashboard-header">
                    <h1 class="dashboard-title">Voice Agent Benchmark</h1>
                    <div class="dashboard-meta">
                        <span class="capability-badge">Voice Agent</span>
                        <span>${totalRuns} run${totalRuns !== 1 ? 's' : ''}</span>
                        <span>${modelNames.length} model${modelNames.length !== 1 ? 's' : ''}</span>
                        <span style="text-transform:capitalize">${escapeHtml(pipelineType)} pipeline</span>
                        <span>${data.timestamp || ''}</span>
                    </div>
                </div>

                <div class="model-cards">
                    ${modelNames.map(m => renderVoiceModelCard(m, summaries[m], pipelineType, pipelineComponents)).join('')}
                </div>

                ${chartsHtml}

                ${renderVoiceScenarioTable(results, modelNames)}

                ${modelNames.map(m => renderVoiceRunsAccordion(m, results[m] || {}, pipelineType, pipelineComponents, audioDirName)).join('')}
            `;

            // Render charts after DOM is ready
            renderVoiceRadarChart(summaries, modelNames);
            renderVoiceLatencyChart(summaries, modelNames, pipelineComponents);
            if (hasMultiModel) {
                renderVoiceDimensionBarsChart(summaries, modelNames);
            }
        }

        // Utility: escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        capabilitySelect.addEventListener('change', (e) => {
            currentCapability = e.target.value;
            loadResults(currentCapability);
            mainContent.innerHTML = '<div class="empty-state"><h2>Select a result file</h2><p>Choose a benchmark result from the sidebar to visualize</p></div>';
        });

        // Initialize
        init();
    </script>
</body>
</html>
