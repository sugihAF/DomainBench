domain:
  name: "Weather API"
  description: "Weather-related function calling benchmark"
  version: "1.0"
  capability: "function_calling"

  categories:
    - simple
    - parallel
    - multiple
    - multi_turn
    - agentic

  functions:
    - name: "get_current_weather"
      description: "Get the current weather for a specified city"
      parameters:
        type: "object"
        properties:
          city:
            type: "string"
            description: "The city name to get weather for"
          country:
            type: "string"
            description: "Country code (e.g., US, UK, JP)"
          unit:
            type: "string"
            enum: ["celsius", "fahrenheit"]
            description: "Temperature unit"
        required:
          - city

    - name: "get_forecast"
      description: "Get weather forecast for upcoming days"
      parameters:
        type: "object"
        properties:
          city:
            type: "string"
            description: "The city name"
          days:
            type: "integer"
            description: "Number of days to forecast (1-14)"
          unit:
            type: "string"
            enum: ["celsius", "fahrenheit"]
        required:
          - city
          - days

    - name: "get_weather_alerts"
      description: "Get active weather alerts for a region"
      parameters:
        type: "object"
        properties:
          region:
            type: "string"
            description: "Region or state name"
          severity:
            type: "string"
            enum: ["low", "medium", "high", "critical"]
            description: "Minimum severity level to filter"
        required:
          - region

    - name: "compare_weather"
      description: "Compare weather between two cities"
      parameters:
        type: "object"
        properties:
          city1:
            type: "string"
            description: "First city"
          city2:
            type: "string"
            description: "Second city"
          metric:
            type: "string"
            enum: ["temperature", "humidity", "wind_speed"]
            description: "Metric to compare"
        required:
          - city1
          - city2
